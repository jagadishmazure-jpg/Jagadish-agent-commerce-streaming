[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcommerce"
version = "0.1.0"
description = "Mock agent payments with signed mandates, plus a streaming chat UI with approvals and cancel"
requires-python = ">=3.11"
license = { text = "MIT" }
# Pinned to the tested minor versions: newer Starlette deprecates its httpx test client.
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
agentcommerce = "agentcommerce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcommerce = ["static/*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["browser: needs Playwright Chromium (skipped if missing)"]
filterwarnings = ["error", "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
